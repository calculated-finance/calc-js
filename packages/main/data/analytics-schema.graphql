  volume: Bigint!
  weight: Bigint!
}

type FinRangeBinConnection {
  pageInfo: PageInfo!
  edges: [FinRangeBinEdge]
}

enum FinRangeStatus {
  OPEN
  CLOSED
}

type FinRangeBin {
  contract: Address!

  bin: Timestamp!

  resolution: String!

  "Opening LP value, in quote"
  openingValue: Point!

  "Closing LP value, in quote"
  closingValue: Point!

  openingBalanceBase: Point!

  openingBalanceQuote: Point!

  closingBalanceBase: Point!

  closingBalanceQuote: Point!

  "Deposits, in quote"
  depositValue: Point!

  "Withdrawals, in quote"
  withdrawalValue: Point!

  "Trade volume, in quote"
  tradeVolume: Point!

  "Fees earned, in quote"
  yield: Point!

  apr: Point!

  moneyMultiple: Point!

  utilizationRatio: Point!
}

type FinRangeSummary implements Node {
  "The ID of an object"
  id: ID!

  "Current TVL in USD"
  tvl: Bigint!

  "24h trade volume in USD"
  volumeDay: Bigint!

  "30d trade volume in USD"
  volumeMonth: Bigint!

  "24h liquidity utilization (volume_day \/ tvl)"
  liquidityUtilizationDay: Bigint!

  "Number of trades in last 24h"
  tradeCountDay: Bigint!

  "30d average APR"
  aprMonth: Bigint!
}

"""
Performance summary for waterfall chart showing value changes between two dates.
Components: Opening Value → Deposits → Price P&L → IL → Earnings → Withdrawals → Closing Value
"""
type FinRangeWaterfall {
  "LP value at the beginning of the period, in quote"
  openingValue: Bigint!

  "Total deposits during the period, in quote"
  deposits: Bigint!

  "Price gains or losses, in quote"
  pricePl: Bigint!

  "Approximate price P&L based on asset price changes, in quote"
  pricePlApprox: Bigint!

  "Impermanent loss (negative means loss), in quote"
  impermanentLoss: Bigint!

  "Total earnings (fees) during the period, in quote"
  earnings: Bigint!

  "Total withdrawals during the period, in quote"
  withdrawals: Bigint!

  "LP value at the end of the period, in quote"
  closingValue: Bigint!
}

type FinRangePositionAnalytics {
  id: ID!

  status: FinRangeStatus!

  firstDepositDate: Timestamp

  "Total deposited, in quote"
  totalDeposited: Bigint!

  "Total withdrawn, in quote"
  totalWithdrawn: Bigint!

  "Realized (claimed) yield, in quote"
  totalRealizedYield: Bigint!

  "Total trade volume routed through the range, in quote"
  totalVolume: Bigint!

  "Number of trade fills that touched the range"
  totalTrades: Int!

  "Current position value at current prices, in quote"
  totalUnrealized: Bigint!

  "Unclaimed yield at current prices, in quote"
  totalUnrealizedYield: Bigint!

  "Deposited base leg, in base token"
  depositedBase: Bigint!

  "Deposited quote leg, in quote token"
  depositedQuote: Bigint!

  "Withdrawn base leg, in base token"
  withdrawnBase: Bigint!

  "Withdrawn quote leg, in quote token"
  withdrawnQuote: Bigint!

  "Realized yield base leg, in base token"
  realizedYieldBase: Bigint!

  "Realized yield quote leg, in quote token"
  realizedYieldQuote: Bigint!

  "Current principal base leg still held, in base token"
  unrealizedBase: Bigint!

  "Current principal quote leg still held, in quote token"
  unrealizedQuote: Bigint!

  "Unclaimed yield base leg still held, in base token"
  unrealizedYieldBase: Bigint!

  "Unclaimed yield quote leg still held, in quote token"
  unrealizedYieldQuote: Bigint!

  weightedAverageEntryDate: Timestamp

  weightedAverageExitDate: Timestamp

  weightedAverageInvestmentAgeDays: Int!

  "Total realized value, in quote"
  totalRealizedValue: Bigint!

  "Total unrealized value, in quote"
  totalUnrealizedValue: Bigint!

  moic: Bigint!

  dpi: Bigint!

  apr: Bigint!
}

